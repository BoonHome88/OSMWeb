<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneSmile Club - Member</title>

<link rel="icon" href="https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.th.png">

<style>
:root{
  --bg-main:#000;
  --glass:rgba(20,20,20,0.75);
  --card:#111;
  --card-hover:#181818;
  --text:#fff;
  --sub:#8f8f8f;
  --accent:#c9a14a;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

body{
  margin:0;
  background:radial-gradient(circle at top,#141414 0%,#000 70%);
  color:var(--text);
}

/* HEADER */
header{
  text-align:center;
  padding:30px 16px;
  letter-spacing:3px;
  font-weight:500;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

header a{
  color:white;
  text-decoration:none;
  transition:.3s;
}
header a:hover{opacity:.6}

/* CONTAINER */
.container{
  max-width:720px;
  margin:60px auto;
  padding:35px;
  border-radius:20px;
  background:var(--glass);
  backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,0.9);
}

h1{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
  letter-spacing:1px;
}

/* SEARCH */
.search-box{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
  background:#0a0a0a;
  color:white;
  margin-bottom:30px;
  font-size:14px;
  transition:.3s;
}
.search-box:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(201,161,74,0.2);
}

/* MEMBER CARD */
.member{
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-radius:16px;
  background:var(--card);
  margin-bottom:14px;
  opacity:0;
  transform:translateY(15px);
  transition:.35s ease;
}

.member.show{
  display:flex;
  opacity:1;
  transform:translateY(0);
}

.member:hover{
  background:var(--card-hover);
  transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
}

.left{
  display:flex;
  align-items:center;
  gap:16px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  border:2px solid rgba(255,255,255,0.08);
  transition:.3s;
}

.member:hover .avatar{
  border-color:var(--accent);
}

.name{
  font-weight:600;
}

.link{
  font-size:12px;
  color:var(--sub);
}

/* ROLE */
.role{
  font-size:10px;
  padding:4px 9px;
  border-radius:999px;
  margin-top:5px;
  display:inline-block;
  letter-spacing:.5px;
  background:rgba(255,255,255,0.08);
  color:white;
}

/* FB BUTTON */
.fb{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#0c0c0c;
  border:1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s;
}
.fb:hover{
  transform:scale(1.08);
  border-color:var(--accent);
}

/* PAGINATION */
.pagination{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:30px;
}

.pagination button{
  background:#1a1a1a;
  border:1px solid rgba(255,255,255,0.1);
  color:white;
  padding:7px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
  font-size:12px;
}

.pagination button:hover:not(:disabled){
  background:#2a2a2a;
}

.pagination button.active{
  background:var(--accent);
  border-color:var(--accent);
}

.pagination button:disabled{
  opacity:.3;
  cursor:default;
}

/* FOOTER */
footer{
  text-align:center;
  font-size:11px;
  color:#666;
  padding:40px 0 20px;
}

@media(max-width:600px){
  .container{margin:30px 15px;padding:25px}
}
</style>
</head>

<body>

<header>
  <a href="Home.html">OneSmile Club - Home</a>
</header>

<div class="container">
<h1>Member of OneSmile</h1>
<input id="search" class="search-box" placeholder="ค้นหาชื่อสมาชิก..." />

<!-- ตัวอย่าง member (ที่เหลือใช้โค้ดเดิมของคุณได้เลย) -->

<div class="member" data-name="BoonHome OneSmile">
<div class="left">
<div class="avatar" style="background-image:url('https://img5.pic.in.th/file/secure-sv1/image9eb0876244807048.th.png')"></div>
<div>
<div class="name">BoonHome OneSmile</div>
<span class="role">LEADER</span>
<div class="link">facebook.com/New.BoonHome</div>
</div>
</div>
<a class="fb" href="https://www.facebook.com/New.BoonHome" target="_blank">
<img src="https://img5.pic.in.th/file/secure-sv1/facebookf1eff851326c8b77.png" width="18">
</a>
</div>

<!-- 👉 ใส่ member ที่เหลือของคุณต่อจากนี้ได้เลย -->

<div class="pagination" id="pagination"></div>
</div>

<footer>OneSmile Entertainment | Powered by BoonHome © 2026</footer>

<script>
const members=[...document.querySelectorAll('.member')];
const search=document.getElementById('search');
const pagination=document.getElementById('pagination');

const perPage=8;
let currentPage=1;
let filtered=members;

function renderMembers(){
const totalPages=Math.ceil(filtered.length/perPage)||1;
currentPage=Math.min(Math.max(currentPage,1),totalPages);

members.forEach(m=>{m.classList.remove('show');m.style.display='none';});

const start=(currentPage-1)*perPage;
filtered.slice(start,start+perPage).forEach((m,i)=>{
m.style.display='flex';
setTimeout(()=>m.classList.add('show'),i*60);
});

renderPagination(totalPages);
}

function renderPagination(totalPages){
pagination.innerHTML='';
for(let i=1;i<=totalPages;i++){
const btn=document.createElement('button');
btn.textContent=i;
if(i===currentPage)btn.classList.add('active');
btn.onclick=()=>{currentPage=i;renderMembers();};
pagination.appendChild(btn);
}
}

search.addEventListener('input',()=>{
const q=search.value.toLowerCase();
filtered=members.filter(m=>m.dataset.name.toLowerCase().includes(q));
currentPage=1;
renderMembers();
});

renderMembers();
</script>
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', function(e) {
    if (
      e.keyCode === 123 || // F12
      (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key)) ||
      (e.ctrlKey && e.key === 'U')
    ) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
