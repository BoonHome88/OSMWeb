<script>
  const text = "HAPPINESS IS SEEING YOUR FAMILY HAPPY.";
  const typingSpeed = 45;
  const deletingSpeed = 20;
  const delayAfterTyping = 10000;

  let i = 0;
  let isDeleting = false;
  const typeEl = document.getElementById("typewriter");

  function loopType() {
    if (!isDeleting) {
      typeEl.innerHTML = text.substring(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => isDeleting = true, delayAfterTyping);
      }
    } else {
      typeEl.innerHTML = text.substring(0, i - 1);
      i--;
      if (i === 0) {
        isDeleting = false;
      }
    }
    setTimeout(loopType, isDeleting ? deletingSpeed : typingSpeed);
  }

  window.addEventListener("load", () => {
    setTimeout(loopType, 800);
  });
</script>

<style>
:root{ --accent:#ffffff; }

/* Bubble */
.music-bubble{
  position:fixed;
  bottom:20px;
  right:20px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(40,40,40,0.7);
  backdrop-filter:blur(25px);

  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;

  transition:transform 0.3s ease, opacity 0.3s ease;
  touch-action:none;
}

.bubble-cover{
  width:60px;
  height:60px;
  border-radius:50%;
  background:url('https://img2.pic.in.th/Untitled-1bc8792a6c7a0f149add66d303697aecc.png') center/cover;

}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
  
.music-bubble:active{
  transform:scale(0.92);
}

.panel-progress-inner{

}


/* Panel */
.music-panel{
  position:fixed;
  bottom:80px;
  right:20px;
  width:280px;
  padding:20px;
  border-radius:28px;
  background:rgba(40,40,40,0.65);

  display:flex;
  flex-direction:column;

  transform:translateY(40px);
  opacity:0;
  pointer-events:none;
  transition:all 0.35s ease;
}

.music-panel.show{
  transform:translateY(0);
  opacity:1;
  pointer-events:auto;
  z-index:10001;
}

.panel-header{
  display:flex;
  gap:12px;
  align-items:center;
}

.panel-cover{
  width:60px;
  height:60px;
  border-radius:16px;
  background:url('https://img2.pic.in.th/Untitled-1bc8792a6c7a0f14973d983369f6345ad.png') center/cover;
}

.panel-progress{
  height:4px;
  background:rgba(255,255,255,0.2);
  border-radius:5px;
  cursor:pointer;

.panel-progress-inner{

/* ===== PREMIUM PLAYER CONTROLS ===== */

/* main play button */

<script>
const audio=document.getElementById("bgSound");
const bubble=document.getElementById("musicBubble");
const panel=document.getElementById("musicPanel");
const playBtn=document.getElementById("playBtn");
const minus = document.querySelector(".minus");
const plus = document.querySelector(".plus");
const progress=document.getElementById("progress");
const progressBar=document.getElementById("progressBar");
const cover=document.getElementById("cover");

if(!audio || !playBtn || !minus || !plus || !bubble || !panel){
  console.warn("Player elements missing");
  return;   // <<< หยุด script ทันที
}

audio.volume=0.4;

// ปุ่มลดเสียง
minus.addEventListener("click",()=>{
  audio.volume = Math.max(0, audio.volume - 0.1);
});

// ปุ่มเพิ่มเสียง
plus.addEventListener("click",()=>{
  audio.volume = Math.min(1, audio.volume + 0.1);
});

/* Auto play */
window.addEventListener("load",()=>{

  const tryPlay = () => {
    audio.play()
      .then(()=> playBtn.innerHTML="❚❚")
      .catch(()=>{});
  };

  tryPlay();

  document.addEventListener("click", tryPlay, { once:true });
  document.addEventListener("touchstart", tryPlay, { once:true });

});

/* Toggle Panel */
bubble.addEventListener("click",()=>{
  panel.classList.toggle("show");
});

/* Play Pause */
playBtn.addEventListener("click",()=>{
  if(audio.paused){
    audio.play();
    playBtn.innerHTML="❚❚";
  }else{
    audio.pause();
    playBtn.innerHTML="▶";
  }
});

/* Sync ปุ่มกับสถานะ audio จริง */
audio.addEventListener("play",()=>{
  playBtn.innerHTML="❚❚";
});

audio.addEventListener("pause",()=>{
  playBtn.innerHTML="▶";
});

/* Progress */
audio.addEventListener("timeupdate",()=>{
  if(audio.duration){
    const percent=(audio.currentTime/audio.duration)*100;
    progress.style.width=percent+"%";
  }
});

progressBar.addEventListener("click",(e)=>{
  const width=progressBar.clientWidth;
  const clickX=e.offsetX;
  audio.currentTime=(clickX/width)*audio.duration;
});

/* Swipe Down to Close Bubble */
let startY=0;
bubble.addEventListener("touchstart",(e)=>{
  startY=e.touches[0].clientY;
});

bubble.addEventListener("touchmove",(e)=>{
  let moveY=e.touches[0].clientY-startY;
  if(moveY>0){
    bubble.style.transform=`translateY(${moveY}px)`;
    bubble.style.opacity=1-(moveY/200);
  }
});

bubble.addEventListener("touchend",(e)=>{
  let endY=e.changedTouches[0].clientY-startY;
  if(endY>120){
    bubble.style.opacity="0";
    setTimeout(()=>bubble.style.display="none",300);
  }else{
    bubble.style.transform="translateY(0)";
    bubble.style.opacity="1";
  }
});
</script>
