    .fade {

      transform: translateY(20px);

    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }
    .delay-5 { animation-delay: 1s; }
    .delay-6 { animation-delay: 1.2s; }

    @keyframes fadeUp {

    /* ===== PREMIUM SUBTITLE ===== */
    .subtitle {

    .subtitle:hover {

    }

    .subtitle-link {
      color: white;
      text-decoration: none;
      position: relative;
      transition: 0.3s ease;
    }

    .subtitle-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background: white;
      transition: 0.3s ease;
    }

    .subtitle-link:hover::after {
      width: 100%;
    }

    .divider {
      margin: 0 10px;

    }

    /* Cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: white;
      margin-left: 3px;
      vertical-align: -2px;
      animation: blink 1.1s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      h2 { font-size: 2rem; }
      .logo { width: 80px; height: 80px; }

<script>
  const text = "HAPPINESS IS SEEING YOUR FAMILY HAPPY.";
  const typingSpeed = 45;
  const deletingSpeed = 20;
  const delayAfterTyping = 10000;

  let i = 0;
  let isDeleting = false;
  const typeEl = document.getElementById("typewriter");

  function loopType() {
    if (!isDeleting) {
      typeEl.innerHTML = text.substring(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => isDeleting = true, delayAfterTyping);
      }
    } else {
      typeEl.innerHTML = text.substring(0, i - 1);
      i--;
      if (i === 0) {
        isDeleting = false;
      }
    }
    setTimeout(loopType, isDeleting ? deletingSpeed : typingSpeed);
  }

  window.addEventListener("load", () => {
    setTimeout(loopType, 800);
  });
</script>

<div class="mini-player" id="miniPlayer">

<audio id="bgSound" preload="auto">

<style>
.mini-player{
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  padding:14px 18px;
  border-radius:20px;
  background:rgba(25,25,25,0.85);

}

.mini-expand{
  position:absolute;
  top:-8px;
  right:12px;
  font-size:12px;
  cursor:pointer;
  opacity:0.5;
  transition:0.3s;
}

.mini-expand:hover{
  opacity:1;
}

/* Responsive */
@media(max-width:768px){
  .mini-player{
    width:90%;
    right:5%;
    bottom:15px;
  }
}
</style>

<script>
const audio = document.getElementById("bgSound");
const playBtn = document.getElementById("miniPlay");
const expandBtn = document.getElementById("expandBtn");
const player = document.getElementById("miniPlayer");

audio.volume = 0;

// 🎵 Auto play หลังโหลด
window.addEventListener("load", () => {
  audio.play().then(() => {
    fadeInAudio();
    playBtn.innerHTML = "❚❚";
  }).catch(() => {
    console.log("Autoplay blocked by browser");
  });
});

// Fade in เสียง
function fadeInAudio(){
  let vol = 0;
  const fade = setInterval(() => {
    if(vol < 0.4){
      vol += 0.02;
      audio.volume = vol;
    } else {
      clearInterval(fade);
    }
  }, 120);
}

// Play / Pause
playBtn.addEventListener("click", () => {
  if(audio.paused){
    audio.play();
    playBtn.innerHTML = "❚❚";
  }else{
    audio.pause();
    playBtn.innerHTML = "▶";
  }
});

// Expand / Collapse
expandBtn.addEventListener("click", () => {
  player.classList.toggle("expanded");
  expandBtn.innerHTML = player.classList.contains("expanded") ? "▼" : "▲";
});
</script>
