<script>
  const text = "HAPPINESS IS SEEING YOUR FAMILY HAPPY.";
  const typingSpeed = 45;
  const deletingSpeed = 20;
  const delayAfterTyping = 10000;

  let i = 0;
  let isDeleting = false;
  const typeEl = document.getElementById("typewriter");

  function loopType() {
    if (!isDeleting) {
      typeEl.innerHTML = text.substring(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => isDeleting = true, delayAfterTyping);
      }
    } else {
      typeEl.innerHTML = text.substring(0, i - 1);
      i--;
      if (i === 0) {
        isDeleting = false;
      }
    }
    setTimeout(loopType, isDeleting ? deletingSpeed : typingSpeed);
  }

  window.addEventListener("load", () => {
    setTimeout(loopType, 800);
  });
</script>

<style>
:root{ --accent:#ffffff; }

/* Bubble */
.music-bubble{
  position:fixed;
  bottom:20px;
  right:20px;
  width:70px;
  height:70px;
  border-radius:50%;
  backdrop-filter:blur(25px);
  background:rgba(40,40,40,0.7);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:9999;
  transition:0.4s ease;
}

.bubble-cover{
  width:60px;
  height:60px;
  border-radius:50%;
  background:url('https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.png') center/cover;
  transition:transform 0.6s linear;
}

.bubble-cover.playing{
  animation:spin 10s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* Panel */
.music-panel{
  position:fixed;
  bottom:100px;
  right:20px;
  width:280px;
  padding:20px;
  border-radius:28px;
  background:rgba(30,30,30,0.8);
  backdrop-filter:blur(35px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  display:none;
  flex-direction:column;
  gap:15px;
  z-index:9998;
}

.music-panel.show{
  display:flex;
  animation:fadeUp 0.4s ease;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.panel-header{
  display:flex;
  gap:12px;
  align-items:center;
}

.panel-cover{
  width:60px;
  height:60px;
  border-radius:16px;
  background:url('https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.png') center/cover;
}

.panel-title{ font-weight:600; }
.panel-artist{ font-size:0.8rem; opacity:0.6; }

.panel-progress{
  height:4px;
  background:rgba(255,255,255,0.2);
  border-radius:5px;
  cursor:pointer;
  overflow:hidden;
}

.panel-progress-inner{
  height:100%;
  width:0%;
  background:var(--accent);
  border-radius:5px;
}

.panel-controls{
  text-align:center;
}

.panel-controls button{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:black;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.panel-controls button:hover{
  transform:scale(1.1);
}

/* Responsive */
@media(max-width:768px){
  .music-panel{ width:90%; right:5%; }
}
</style>

<script>
const audio=document.getElementById("bgSound");
const bubble=document.getElementById("musicBubble");
const panel=document.getElementById("musicPanel");
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");
const progressBar=document.getElementById("progressBar");
const cover=document.getElementById("cover");

audio.volume=0.4;

/* Auto play */
window.addEventListener("load",()=>{
  audio.play().then(()=>{
    cover.classList.add("playing");
    playBtn.innerHTML="❚❚";
  }).catch(()=>{});
});

/* Toggle Panel */
bubble.addEventListener("click",()=>{
  panel.classList.toggle("show");
});

/* Play Pause */
playBtn.addEventListener("click",()=>{
  if(audio.paused){
    audio.play();
    cover.classList.add("playing");
    playBtn.innerHTML="❚❚";
  }else{
    audio.pause();
    cover.classList.remove("playing");
    playBtn.innerHTML="▶";
  }
});

/* Progress */
audio.addEventListener("timeupdate",()=>{
  const percent=(audio.currentTime/audio.duration)*100;
  progress.style.width=percent+"%";
});

progressBar.addEventListener("click",(e)=>{
  const width=progressBar.clientWidth;
  const clickX=e.offsetX;
  audio.currentTime=(clickX/width)*audio.duration;
});

/* Dynamic Color */
const img=new Image();
img.crossOrigin="anonymous";
img.src="https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.png";
img.onload=function(){
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");
  canvas.width=img.width;
  canvas.height=img.height;
  ctx.drawImage(img,0,0);
  const data=ctx.getImageData(0,0,1,1).data;
  const color=`rgb(${data[0]},${data[1]},${data[2]})`;
  document.documentElement.style.setProperty("--accent",color);
};
</script>
