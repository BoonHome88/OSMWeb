<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSmile Club</title>
  
  <meta property="og:title" content="OneSmile Club">
  <meta property="og:description" content="OneSmile Club | Member list & Partner&#10;OneSmile Entertainment | Video & Music" />
  <meta property="og:image" content="https://img5.pic.in.th/file/secure-sv1/rtyrtytryt6e01016a330a6bfa.th.png">
  <meta property="og:type" content="website">

  <link rel="icon" href="https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.th.png" type="image/png">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: white;
    }

    .main-content {
      height: 100vh;
      width: 100%;
      background-image: url('https://img2.pic.in.th/ghjkghjkjh-4.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .main-content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      margin: 0 0 25px;
      font-size: 1.1rem;
      max-width: 700px;
      opacity: 0.9;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 30px;
      background: #696969;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #BEBEBE;
      transform: translateY(-2px);
    }

    .btns {
      display: inline-block;
      padding: 10px 24px;
      margin: 6px;
      background: #1c1c1c;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btns:hover {
      background: #2a2a2a;
      transform: translateY(-2px);
    }

    .gang h3 {
      margin: 30px 0 15px;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    .fade {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }

    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }
    .delay-4 { animation-delay: 0.8s; }
    .delay-5 { animation-delay: 1s; }
    .delay-6 { animation-delay: 1.2s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== PREMIUM SUBTITLE ===== */
    .subtitle {
      margin-top: 35px;
      width: 100%;
      display: flex;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      opacity: 0.6;
      transition: 0.3s ease;
    }

    .subtitle:hover {
      opacity: 0.9;
    }

    .subtitle-link {
      color: white;
      text-decoration: none;
      position: relative;
      transition: 0.3s ease;
    }

    .subtitle-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background: white;
      transition: 0.3s ease;
    }

    .subtitle-link:hover::after {
      width: 100%;
    }

    .divider {
      margin: 0 10px;
      opacity: 0.4;
    }

    /* Cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: white;
      margin-left: 3px;
      vertical-align: -2px;
      animation: blink 1.1s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      h2 { font-size: 2rem; }
      .logo { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>

<section class="main-content">
  <div class="content">

    <img src="https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.png"
         class="logo fade delay-1">

    <h2 class="fade delay-2">OneSmile Club</h2>

    <p class="fade delay-3">
      OSM | <span id="typewriter"></span><span class="cursor"></span>
    </p>

    <div class="btn-group fade delay-4">
      <a href="MEMBER.html" class="btn">MEMBER OF ONESMILE</a>
      <a href="Shop.html" class="btn">ONESMILE SHOP</a>
    </div>

    <div class="gang fade delay-5">
      <h3>GANG & PARTNER</h3>

      <a class="btns">Babydevil</a>
      <a class="btns">Jujubae</a>
      <a class="btns">Beside X Seth</a>
      <a class="btns" href="https://discord.gg/midnightracing" target="_blank">MR Original</a>
      <a class="btns" href="https://discord.gg/AQ6V56FSzF" target="_blank">OntheFlow</a>

      <p class="subtitle fade delay-6">
        <a href="https://www.facebook.com/OneSmile168"
           target="_blank"
           class="subtitle-link">
          OneSmile Entertainment
        </a>
        <span class="divider">|</span>
        What would I do without you?
      </p>
    </div>

  </div>
</section>

<script>
  const text = "HAPPINESS IS SEEING YOUR FAMILY HAPPY.";
  const typingSpeed = 45;
  const deletingSpeed = 20;
  const delayAfterTyping = 15000;

  let i = 0;
  let isDeleting = false;
  const typeEl = document.getElementById("typewriter");

  function loopType() {
    if (!isDeleting) {
      typeEl.innerHTML = text.substring(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => isDeleting = true, delayAfterTyping);
      }
    } else {
      typeEl.innerHTML = text.substring(0, i - 1);
      i--;
      if (i === 0) {
        isDeleting = false;
      }
    }
    setTimeout(loopType, isDeleting ? deletingSpeed : typingSpeed);
  }

  window.addEventListener("load", () => {
    setTimeout(loopType, 800);
  });
</script>
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', function(e) {
    if (
      e.keyCode === 123 || // F12
      (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key)) ||
      (e.ctrlKey && e.key === 'U')
    ) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
