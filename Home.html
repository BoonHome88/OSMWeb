<script>
  const text = "HAPPINESS IS SEEING YOUR FAMILY HAPPY.";
  const typingSpeed = 45;
  const deletingSpeed = 20;
  const delayAfterTyping = 10000;

  let i = 0;
  let isDeleting = false;
  const typeEl = document.getElementById("typewriter");

  function loopType() {
    if (!isDeleting) {
      typeEl.innerHTML = text.substring(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => isDeleting = true, delayAfterTyping);
      }
    } else {
      typeEl.innerHTML = text.substring(0, i - 1);
      i--;
      if (i === 0) {
        isDeleting = false;
      }
    }
    setTimeout(loopType, isDeleting ? deletingSpeed : typingSpeed);
  }

  window.addEventListener("load", () => {
    setTimeout(loopType, 800);
  });
</script>

  height:100%;
  width:0%;

  border-radius:5px;

  display:flex;
  justify-content:space-between;
  font-size:0.7rem;

  text-align:center;
  margin:12px 0;

  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:black;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

.ios-controls button:hover{
  transform:scale(1.1);
}

  display:flex;
  align-items:center;
  gap:8px;

<script>
const audio = document.getElementById("bgSound");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const volume = document.getElementById("volume");
const cover = document.getElementById("cover");

audio.volume = 0.4;
volume.value = 0.4;

/* Auto Play */
window.addEventListener("load", () => {
  audio.play().then(()=>{
    playBtn.innerHTML="❚❚";
    cover.classList.add("playing");
  }).catch(()=>{});
});

/* Play Pause */
playBtn.addEventListener("click", ()=>{
  if(audio.paused){
    audio.play();
    playBtn.innerHTML="❚❚";
    cover.classList.add("playing");
  }else{
    audio.pause();
    playBtn.innerHTML="▶";
    cover.classList.remove("playing");
  }
});

/* Progress */
audio.addEventListener("timeupdate", ()=>{
  const percent=(audio.currentTime/audio.duration)*100;
  progress.style.width=percent+"%";
  currentTimeEl.textContent=formatTime(audio.currentTime);
  durationEl.textContent=formatTime(audio.duration);
});

progressBar.addEventListener("click",(e)=>{
  const width=progressBar.clientWidth;
  const clickX=e.offsetX;
  audio.currentTime=(clickX/width)*audio.duration;
});

/* Volume */
volume.addEventListener("input",()=>{
  audio.volume=volume.value;
});

/* Format Time */
function formatTime(t){
  if(isNaN(t)) return "0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60);
  return m+":"+(s<10?"0"+s:s);
}

/* 🎨 Dynamic Color from Cover */
const img = new Image();
img.crossOrigin="anonymous";
img.src="https://img5.pic.in.th/file/secure-sv1/Untitled-1bc8792a6c7a0f149.png";

img.onload=function(){
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");
  canvas.width=img.width;
  canvas.height=img.height;
  ctx.drawImage(img,0,0);
  const data=ctx.getImageData(0,0,1,1).data;
  const color=`rgb(${data[0]},${data[1]},${data[2]})`;
  document.documentElement.style.setProperty("--accent",color);
};
</script>
